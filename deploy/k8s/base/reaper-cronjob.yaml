# Returns images whose leases expired (closed laptops, dropped connections) to their queue.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: labeler-reaper
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 55
      template:
        metadata:
          labels:
            app.kubernetes.io/name: labeler-reaper
        spec:
          restartPolicy: Never
          serviceAccountName: labeler-api
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: labeler-backend
              command: ["python", "-m", "app.reaper"]
              envFrom:
                - configMapRef:
                    name: labeler-api-config
                - secretRef:
                    name: labeler-api-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]

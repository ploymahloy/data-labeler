# Requires the External Secrets Operator and a ClusterSecretStore named `aws-secrets-manager`
# (installed and wired to the IRSA role by infra/terraform).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: labeler-api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: labeler-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: REPLACE_ME/app # Secrets Manager secret id (output `app_secret_name`)
        property: database_url
    - secretKey: CLOUDFRONT_PRIVATE_KEY_PEM
      remoteRef:
        key: REPLACE_ME/app
        property: cloudfront_private_key_pem

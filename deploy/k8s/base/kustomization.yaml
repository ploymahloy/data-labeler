apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: labeler

labels:
  - pairs:
      app.kubernetes.io/part-of: data-labeler
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecret.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - api-ingress.yaml
  - reaper-cronjob.yaml

images:
  - name: labeler-backend
    newName: 000000000000.dkr.ecr.us-east-1.amazonaws.com/data-labeler-backend
    newTag: latest

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: labeler

labels:
  - pairs:
      app.kubernetes.io/part-of: data-labeler
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - externalsecret.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - api-pdb.yaml
  - api-ingress.yaml
  - networkpolicies.yaml
  - reaper-cronjob.yaml
# Image names are set per environment in the overlays (they are separate ECR repositories).

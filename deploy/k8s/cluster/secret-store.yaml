# Applied once per cluster, after the External Secrets Operator is installed (infra/terraform).
# Credentials come from the operator's own IRSA role.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1

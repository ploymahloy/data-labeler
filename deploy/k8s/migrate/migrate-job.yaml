apiVersion: batch/v1
kind: Job
metadata:
  name: labeler-migrate
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labeler-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: labeler-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: labeler-backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: labeler-api-config
            - secretRef:
                name: labeler-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

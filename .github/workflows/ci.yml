name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labeler
          POSTGRES_PASSWORD: labeler
          POSTGRES_DB: labeler_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labeler"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://labeler:labeler@localhost:5432/labeler_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint # includes func-style: const arrow functions only
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: labeler
          POSTGRES_PASSWORD: labeler
          POSTGRES_DB: labeler_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labeler"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://labeler:labeler@localhost:5432/labeler_dev
      AUTH_MODE: dev
      DEV_AUTH_SECRET: ci-dev-secret-ci-dev-secret-ci-dev-secret
      S3_BUCKET: labeler-images
      S3_ENDPOINT_URL: http://localhost:4566
      S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend deps
        run: pip install -e "backend[dev]"
      - name: Start moto (S3) and create bucket
        run: |
          moto_server -p 4566 > /tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4566/moto-api/ >/dev/null && break; sleep 1; done
          python - <<'PY'
          import boto3
          boto3.client("s3", endpoint_url="http://localhost:4566", region_name="us-east-1").create_bucket(Bucket="labeler-images")
          PY
      - name: Migrate and start API
        working-directory: backend
        run: |
          alembic upgrade head
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/readyz >/dev/null && break; sleep 1; done
      - name: Frontend deps and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/api.log
            /tmp/moto.log
            frontend/test-results

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          kubectl kustomize deploy/k8s/overlays/prod > /dev/null
          kubectl kustomize deploy/k8s/migrate > /dev/null

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

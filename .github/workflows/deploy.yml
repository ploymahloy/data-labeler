name: Deploy

# After CI passes on main: deploy to staging automatically, smoke-test it, then wait for a human
# to approve production. The approval gate is the GitHub environment "production": add required
# reviewers under Settings > Environments > production (it cannot be declared in this file).
# See docs/runbooks/rollback.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    # workflow_run runs in a privileged context, so only deploy what CI built from a push to this
    # repository's own main: never a fork PR that merely has a branch named "main".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      overlay: staging
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  production:
    needs: staging
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
      overlay: prod
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

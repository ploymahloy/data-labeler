name: Deploy

# Runs after CI succeeds on main. Requires repository variables:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, EKS_CLUSTER_NAME, ECR_REPOSITORY (full URL),
#   WEB_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, VITE_API_URL, VITE_COGNITO_DOMAIN, VITE_COGNITO_CLIENT_ID
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  api:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Run database migrations
        run: |
          cd deploy/k8s/migrate
          kustomize edit set image labeler-backend="${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}"
          cd -
          kubectl -n labeler delete job labeler-migrate --ignore-not-found --wait=true
          kubectl apply -k deploy/k8s/migrate
          kubectl -n labeler wait --for=condition=complete job/labeler-migrate --timeout=300s \
            || { kubectl -n labeler logs job/labeler-migrate --tail=200; exit 1; }

      - name: Roll out API and reaper
        run: |
          cd deploy/k8s/overlays/prod
          kustomize edit set image labeler-backend="${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}"
          cd -
          kubectl apply -k deploy/k8s/overlays/prod
          kubectl -n labeler rollout status deployment/labeler-api --timeout=300s

  web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_AUTH_MODE: cognito
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sync to S3 (hashed assets immutable, index.html never cached)
        run: |
          aws s3 sync dist "s3://${{ vars.WEB_BUCKET }}" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"
      - run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html"

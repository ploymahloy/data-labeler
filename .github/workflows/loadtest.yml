name: Load test

# Not part of the PR gate: it takes minutes and wants a quiet machine. Run it nightly and on
# demand (for example before raising MAX_API_PODS or changing pool sizing).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      labelers:
        description: Concurrent annotators
        default: "300"
      reviewers:
        description: Concurrent reviewers
        default: "100"
      images:
        description: Images in the batch
        default: "1500"

permissions:
  contents: read

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Load-test dependencies
        run: pip install -e backend
      - name: Start the stack
        run: |
          docker compose up -d --build
          for _ in $(seq 1 60); do curl -sf http://localhost:8000/readyz >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8000/readyz
      - name: Run the load test
        working-directory: backend
        env:
          LABELERS: ${{ github.event.inputs.labelers || '300' }}
          REVIEWERS: ${{ github.event.inputs.reviewers || '100' }}
          IMAGES: ${{ github.event.inputs.images || '1500' }}
        run: |
          python -m loadtest.run \
            --labelers "$LABELERS" --reviewers "$REVIEWERS" --images "$IMAGES" \
            --database-url postgresql://labeler:labeler@localhost:5432/labeler \
            --max-db-connections 20 \
            --report "$RUNNER_TEMP/loadtest.json"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loadtest-report
          path: ${{ runner.temp }}/loadtest.json
          if-no-files-found: ignore
      - name: API log on failure
        if: failure()
        run: docker compose logs --tail=300 api reaper db
      - name: Stop the stack
        if: always()
        run: docker compose down -v
